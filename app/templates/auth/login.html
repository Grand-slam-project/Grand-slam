{% extends "base.html" %}

{% block styles %}
<!-- 로그인 페이지 전용 CSS 연결 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<!-- 로그인 페이지 전체 영역 -->
<div class="login-page">

    <!-- 로그인 메인 컨테이너 -->
    <div class="login-container">


        <section class="left-section">


            <div class="image-box">
              <img src="{{ url_for('static', filename='img/handshake.svg') }}" alt="악수 아이콘" class="trust-icon">
            </div>


            <h1 class="main-title">
              안전한 거래 보장
            </h1>


            <p class="sub-text">
               모든 거래는 인증된 사용자끼리 진행되고<br>
                문제가 생기면 빠르게 도와드려요
            </p>
        </section>


        <div class="divider"></div>


        <section class="right-section">

            <!-- 사이트 로고 텍스트 -->
            <h3 class="logo-text">만루홈런</h3>

            <!-- 로그인 폼 -->
            <form class="login-form" method="post" action="">

                <!-- 이메일 입력 그룹 -->
                <div class="input-group">
                    <label for="email">아이디(이메일)</label>
                    <input type="email" id="email" name="email" placeholder="아이디(이메일) 입력">
                </div>

                <!-- 비밀번호 입력 그룹 -->
                <div class="input-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력">
                </div>

                <!-- 아이디 저장 체크박스 -->
                <div class="save-id">
                    <input type="checkbox" id="saveId" name="saveId">
                    <label for="saveId">아이디 저장</label>
                </div>

                <!-- 로그인 버튼 -->
                <button type="submit" class="btn-login">로그인</button>

                <!-- 버튼 사이 구분선 -->
                <div class="divider-line"></div>

                <!-- 카카오 로그인 버튼 -->
                <button type="button" class="btn-kakao">
                    <img src="{{ url_for('static', filename='img/kakao.svg') }}" alt="카카오">
                    카카오 1초 로그인/회원가입
                </button>

                <!-- 이메일 회원가입 버튼 -->
                <button type="button" class="btn-email">이메일로 회원가입</button>

            </form>
        </section>

    </div>
</div>

{% endblock %}
